name: VIN master

# Helps a VIN master update running on the PC (npm run vin:master) finish sooner. It SAVES to the live DMS.
# Started by hand only (Actions > VIN master > Run workflow), after the PC has split the VINs still to do:
#   node "pdi/scripts/vinMasterGitHub.js" --split <jobs> --keep <VINs for the PC>
# which puts todo/chunk-<i>.txt on the vin-master-runs branch. One job per chunk, each running
# pdi/Vin_Master_update.spec.ts headless with VIN_LIST set to its chunk, sends its progress file back to
# results/chunk-<i>.jsonl on that branch every 5 minutes and at the end; the PC takes them with --merge.
run-name: VIN master (${{ github.event.inputs.sessions }} sessions per job)
on:
  workflow_dispatch:
    inputs:
      sessions:
        description: 'River User sessions per job'
        type: choice
        options: ['2', '3', '4']
        default: '3'

permissions:
  contents: write   # results go back to the vin-master-runs branch

jobs:
  chunks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      list: ${{ steps.list.outputs.list }}
    steps:
      - uses: actions/checkout@v5
      - id: list
        run: |
          git fetch --depth=1 origin vin-master-runs \
            || { echo "::error::No vin-master-runs branch. Run vinMasterGitHub.js --split on the PC first."; exit 1; }
          list=$(git ls-tree --name-only FETCH_HEAD todo/ | sed -n 's#^todo/chunk-\([0-9]*\)\.txt$#\1#p' | sort -n | jq -Rsc 'split("\n") | map(select(. != ""))')
          [ "$list" = "[]" ] && { echo "::error::No todo/chunk-*.txt on vin-master-runs."; exit 1; }
          echo "Chunks: $list"
          echo "list=$list" >> "$GITHUB_OUTPUT"

  vin-master:
    needs: chunks
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        chunk: ${{ fromJSON(needs.chunks.outputs.list) }}
    env:
      CI: '1'
      TZ: Asia/Kolkata
      BROWSER_CHANNEL: chrome
      PDI_RUN: '1'
      PW_GLOBAL_TIMEOUT_MIN: '165'
      VIN_MASTER_PARALLEL: ${{ github.event.inputs.sessions }}
      VIN_LIST: ${{ github.workspace }}/vin-chunk.txt
      CREDENTIALS_FILE: ${{ github.workspace }}/resources/credentials.json
      PROGRESS: Output/VIN Master/VIN_Master_progress.jsonl
      CHUNK: ${{ matrix.chunk }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chrome

      - name: Write DMS credentials from the CREDENTIALS_JSON secret
        env:
          CREDS: ${{ secrets.CREDENTIALS_JSON }}
        run: |
          if [ -z "$CREDS" ]; then echo "::error::Repository secret CREDENTIALS_JSON is not set"; exit 1; fi
          printf '%s' "$CREDS" > "$CREDENTIALS_FILE"
          node -e "const c=JSON.parse(require('fs').readFileSync(process.env.CREDENTIALS_FILE,'utf8')); if(!c.riverUserValidUser?.username) process.exit(2)" \
            || { echo "::error::CREDENTIALS_JSON is not valid JSON or has no riverUserValidUser"; exit 1; }

      - name: Get the VIN sheet and this job's chunk
        run: |
          git fetch --depth=1 origin vin-data
          git show FETCH_HEAD:VIN_Details.csv > "resources/VIN_Details.csv"
          git fetch --depth=1 origin vin-master-runs
          git show "FETCH_HEAD:todo/chunk-$CHUNK.txt" > "$VIN_LIST"
          echo "Chunk $CHUNK: $(grep -c . "$VIN_LIST") VINs"

      # Sends the progress file to results/chunk-<i>.jsonl, on top of whatever the other jobs sent meanwhile.
      - name: Write the send script
        run: |
          cat > "$RUNNER_TEMP/send.sh" <<'EOF'
          #!/usr/bin/env bash
          [ -s "$PROGRESS" ] || exit 0
          export GIT_AUTHOR_NAME="VIN master" GIT_AUTHOR_EMAIL="vin-master@users.noreply.github.com"
          export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME" GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
          blob=$(git hash-object -w "$PROGRESS")
          for i in 1 2 3 4 5 6; do
            git fetch -q origin vin-master-runs || { sleep 5; continue; }
            parent=$(git rev-parse FETCH_HEAD)
            GIT_INDEX_FILE="$RUNNER_TEMP/index" git read-tree "$parent"
            GIT_INDEX_FILE="$RUNNER_TEMP/index" git update-index --add --cacheinfo "100644,$blob,results/chunk-$CHUNK.jsonl"
            tree=$(GIT_INDEX_FILE="$RUNNER_TEMP/index" git write-tree)
            [ "$tree" = "$(git rev-parse "$parent^{tree}")" ] && exit 0
            sha=$(git commit-tree "$tree" -p "$parent" -m "VIN master chunk $CHUNK: $(grep -c . "$PROGRESS") VIN(s)")
            git push -q origin "$sha:refs/heads/vin-master-runs" && exit 0
            sleep $((RANDOM % 10 + 2))
          done
          echo "::warning::Could not send chunk $CHUNK results this time."
          EOF
          chmod +x "$RUNNER_TEMP/send.sh"

      - name: VIN master update (sends results every 5 minutes)
        run: |
          ( while true; do sleep 300; "$RUNNER_TEMP/send.sh"; done ) &
          sender=$!
          status=0
          npx playwright test "pdi/Vin_Master_update.spec.ts" --reporter=line || status=$?
          kill "$sender" 2>/dev/null || true
          exit $status

      - name: Send the final results
        if: ${{ always() }}
        run: '"$RUNNER_TEMP/send.sh"'

      - name: Upload the result workbook
        uses: actions/upload-artifact@v6
        if: ${{ always() }}
        with:
          name: vin-master-chunk-${{ matrix.chunk }}
          path: Output/VIN Master/
          if-no-files-found: ignore
          retention-days: 7
