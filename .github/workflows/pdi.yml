name: PDI

# Blank Engine / Battery / Charger fill-up. It SAVES to the live DMS. For now the hourly run uses only
# "pdi/PDI_Update_InTransit.spec.ts" (one River User login, every vehicle in Inventory Stock Details with a
# blank detail); the per-dealer "pdi/PDI.spec.ts" step is commented out below.
# The VIN details come from the (private) VIN Google Sheet: its Apps Script
# (resources/apps-script/pushVinToGitHub.gs) sends it every 15 minutes, when changed, to VIN_Details.csv
# on the vin-data branch, and each run reads that file. The team only has to keep the sheet up to date.
#   - hourly 07:47-17:47 IST: fill and Save as River User from Inventory Stock Details (no email)
#   - daily 19:17 IST: the day's one PDI email, covering all of that day's runs
# GitHub's own schedule skips many runs (whole days in Oct 2026), so the Scheduler workflow
# (scheduler.yml) starts these runs at those times. The crons below are only a backup: a scheduled run
# does nothing while a Scheduler run is going.
run-name: PDI ${{ github.event.inputs.task || (github.event.schedule == '47 13 * * *' && 'daily-email (scheduled)') || 'pdi (scheduled)' }}
on:
  schedule:
    - cron: '17 2-12 * * *'   # 07:47-17:47 IST, hourly (off :00/:30, when GitHub drops the most scheduled runs)
    - cron: '47 13 * * *'     # 19:17 IST
  workflow_dispatch:
    inputs:
      task:
        description: 'What to run'
        type: choice
        options: [pdi, intransit, daily-email]
        default: pdi
      dealers:
        description: 'Only these dealer codes, comma-separated (blank = all PDI dealers)'
        required: false
        default: ''

permissions:
  contents: write   # pdiSync.js sends the shared PDI results to the pdi-runs branch
  actions: read     # the Scheduler check and the daily email's wait for other PDI runs

jobs:
  # A scheduled run does nothing while the Scheduler is going: the Scheduler starts this slot's run.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      go: ${{ steps.check.outputs.go }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          go=true
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            clock=$(gh run list -R "$GITHUB_REPOSITORY" --workflow scheduler.yml --limit 10 --json status \
              --jq '[.[] | select(.status != "completed")] | length' || echo 0)
            if [ "$clock" != "0" ]; then
              go=false
              echo "The Scheduler is going and starts this slot's run itself, nothing to do."
            fi
          fi
          echo "go=$go" >> "$GITHUB_OUTPUT"

  pdi:
    needs: check
    if: needs.check.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    # One PDI job at a time: an hourly run still going makes the next one wait instead of overlapping,
    # and each job sees the state the previous one saved. GitHub keeps only one waiting job per group,
    # so the daily email has its own group (else it would cancel a waiting hourly run) and instead waits
    # itself for any PDI job still going or queued (first step below).
    concurrency:
      group: ${{ (github.event.inputs.task == 'daily-email' || github.event.schedule == '47 13 * * *') && 'pdi-email' || 'pdi' }}
      cancel-in-progress: false
    env:
      CI: '1'
      TZ: Asia/Kolkata                 # "today" for the daily file and email, in Indian time
      BROWSER_CHANNEL: chrome
      PDI_RUN: '1'
      CREDENTIALS_FILE: ${{ github.workspace }}/resources/credentials.json
      PDI_DEALER: ${{ github.event.inputs.dealers }}
      GMAIL_USER: ${{ secrets.GMAIL_USER }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      GMAIL_TO: ${{ secrets.GMAIL_TO }}
      PDI_CC: ${{ secrets.PDI_CC }}
      TASK: ${{ github.event.inputs.task || (github.event.schedule == '47 13 * * *' && 'daily-email') || 'pdi' }}
    steps:
      # The email must include the day's last hourly run, so wait (up to 130 min) for PDI runs still going or queued.
      - name: Wait for PDI runs still going
        if: env.TASK == 'daily-email'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 26); do
            busy=$(gh run list -R "$GITHUB_REPOSITORY" --workflow pdi.yml --limit 20 --json databaseId,status \
              --jq "[.[] | select(.databaseId != $GITHUB_RUN_ID and (.status | test(\"in_progress|queued|pending|waiting|requested\")))] | length")
            [ "$busy" = "0" ] && { echo "No other PDI run going."; exit 0; }
            echo "$busy PDI run(s) still going or queued, checking again in 5 min."
            sleep 300
          done
          echo "::warning::PDI runs still going after 130 min; sending the email with what is saved so far."

      - name: Check the DMS can be reached from GitHub
        if: env.TASK != 'daily-email'
        run: |
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 https://rivermobility.gaindms.com/ || echo 000)
          echo "DMS answered with HTTP $code"
          if [ "$code" = "000" ] || [ "$code" -ge 500 ]; then
            echo "::error::GitHub's servers could not reach https://rivermobility.gaindms.com/ (HTTP $code)."
            exit 1
          fi

      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Google Chrome for Playwright
        if: env.TASK != 'daily-email'
        run: npx playwright install --with-deps chrome

      - name: Write DMS credentials from the CREDENTIALS_JSON secret
        env:
          CREDS: ${{ secrets.CREDENTIALS_JSON }}
        run: |
          if [ -z "$CREDS" ]; then echo "::error::Repository secret CREDENTIALS_JSON is not set"; exit 1; fi
          printf '%s' "$CREDS" > "$CREDENTIALS_FILE"
          node -e "const c=JSON.parse(require('fs').readFileSync(process.env.CREDENTIALS_FILE,'utf8')); if(!c.PIDLogin&&!(c.PIDUsers||[]).length) process.exit(2)" \
            || { echo "::error::CREDENTIALS_JSON is not valid JSON or has no PIDLogin / PIDDealerCodes / PIDUsers"; exit 1; }

      - name: Get the VIN sheet from the vin-data branch
        if: env.TASK != 'daily-email'
        run: |
          git fetch --depth=1 origin vin-data \
            || { echo "::error::No vin-data branch yet. Run pushVinToGitHub in the VIN sheet's Apps Script (resources/apps-script/pushVinToGitHub.gs)."; exit 1; }
          git show FETCH_HEAD:VIN_Details.csv > "resources/VIN_Details.csv"
          echo "VIN sheet last changed: $(git log -1 --format='%cd' --date=format-local:'%d-%m-%Y %H:%M IST' FETCH_HEAD), $(($(wc -l < "resources/VIN_Details.csv") - 1)) rows"

      # The day's run files, daily copy, history, VIN column baseline and "emailed today" marker,
      # carried from one job to the next (each GitHub runner starts empty).
      - name: Restore PDI state
        uses: actions/cache/restore@v5
        with:
          path: |
            Output/PDI runs/
            Output/PDI_*
          key: pdi-state-${{ github.run_id }}
          restore-keys: pdi-state-

      # Take what a PC (npm run test:pdi*, report:pdi-daily) added to the pdi-runs branch: run files,
      # "emailed today" marker and histories ("pdi/scripts/pdiSync.js"), so the daily file, "till now"
      # totals and email are the same whichever side builds them.
      - name: Take PDI results from the pdi-runs branch
        run: node "pdi/scripts/pdiSync.js" --pull

      # PDI.spec.ts is off for now: the Inventory Stock Details run below covers the blank vehicles as River User.
      # - name: PDI fill and Save
      #   if: env.TASK == 'pdi'
      #   run: npx playwright test "pdi/PDI.spec.ts"

      # Vehicles from MIS > Inventory Stock Details ("pdi/PDI_Update_InTransit.spec.ts"), one River User
      # session. Only vehicles with a blank Engine / Battery / Charger are taken.
      - name: In-Transit fill and Save
        if: ${{ !cancelled() && (env.TASK == 'pdi' || env.TASK == 'intransit') }}
        run: npx playwright test "pdi/PDI_Update_InTransit.spec.ts"

      - name: Daily PDI email
        if: env.TASK == 'daily-email'
        run: npx playwright test "pdi/PDIDailyReport.spec.ts" --reporter=line

      # This run's files, the merged histories and any "emailed today" marker go back, for the PC.
      - name: Send PDI results to the pdi-runs branch
        if: ${{ !cancelled() }}
        run: node "pdi/scripts/pdiSync.js"

      - name: Save PDI state for the next run
        uses: actions/cache/save@v5
        if: ${{ !cancelled() && hashFiles('Output/PDI_*', 'Output/PDI runs/**') != '' }}
        with:
          path: |
            Output/PDI runs/
            Output/PDI_*
          key: pdi-state-${{ github.run_id }}

      # Chassis-level results - keep the downloads short-lived.
      - name: Upload PDI output
        uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: pdi-output
          path: |
            Output/PDI runs/
            Output/PDI_*
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload Playwright report and results
        uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: playwright-results
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
